<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>録音くん</title>
</head>
<body>
  <h1>録音くん</h1>
  <p>下のボタンから録音できます。</p>
  <button id="recordButton">録音開始</button>
  <button id="stopButton" disabled>停止</button>
  <p id="status"></p>

  <script>
    // 【重要】ここにGASでデプロイした「ウェブアプリのURL」を入力してください
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyc3-Q8PFszl0vN3rj4wjUova3AgtOk0ne7KLPdXf8uYTi1n110-klhDZYgVMu99YO5rQ/exec";

    let mediaRecorder;
    let audioChunks = [];

    document.getElementById('recordButton').onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = uploadAudio;
      mediaRecorder.start();
      document.getElementById('recordButton').disabled = true;
      document.getElementById('stopButton').disabled = false;
      document.getElementById('status').innerText = "録音中...";
    };

    document.getElementById('stopButton').onclick = () => {
      mediaRecorder.stop();
      document.getElementById('recordButton').disabled = false;
      document.getElementById('stopButton').disabled = true;
      document.getElementById('status').innerText = "保存中...";
    };

    async function uploadAudio() {
      const blob = new Blob(audioChunks, { type: 'audio/mp3' });
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64data = reader.result;
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ file: base64data, name: "recording.mp3" })
        });
        document.getElementById('status').innerText = "保存完了！";
        audioChunks = [];
      };
    }
  </script>
</body>
</html>
