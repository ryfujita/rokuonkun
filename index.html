<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>録音くん（改良版）</title>
</head>
<body>
  <h2>🎤 録音くん</h2>

  <button id="startBtn">録音開始</button>
  <button id="stopBtn" disabled>録音停止</button>

  <p id="status">待機中</p>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    const API_URL = "YOUR_GAS_URL"; // ← 必ず変更

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");

    // ===== 録音開始 =====
    startBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: "audio/mp3" });

        const base64 = await convertToBase64(blob);
        const dataUrl = "data:audio/mp3;base64," + base64.split(",")[1];

        await sendToServer(dataUrl);
      };

      mediaRecorder.start();

      status.textContent = "録音中...";
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    // ===== 録音停止 =====
    stopBtn.onclick = () => {
      mediaRecorder.stop();
      status.textContent = "送信中...";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // ===== base64変換 =====
    function convertToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // ===== GASへ送信 =====
    async function sendToServer(audioData) {
      try {
        const fileName = "rec_" + new Date().toISOString().replace(/[:.]/g, "-");

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            audioData: audioData,
            fileName: fileName
          })
        });

        const result = await response.json();

        if (result.success) {
          status.innerHTML = "✅ 保存成功<br><a href='" + result.fileUrl + "' target='_blank'>ファイルを見る</a>";
        } else {
          status.textContent = "❌ エラー: " + result.message;
        }

      } catch (error) {
        status.textContent = "❌ 通信エラー: " + error.message;
      }
    }
  </script>
</body>
</html>
