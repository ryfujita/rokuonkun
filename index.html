<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>録音くん (GitHub Pages版)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); min-height: 100vh; color: #333; }
    .container { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); max-width: 550px; margin: auto; }
    h1 { color: #667eea; text-align: center; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input[type="text"], select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 15px; }
    .button-group { display: flex; gap: 10px; margin: 20px 0; }
    button { flex: 1; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    #recordButton { background: #11998e; }
    #stopButton { background: #ee0979; }
    #saveButton { background: #667eea; width: 100%; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 20px; padding: 15px; border-radius: 12px; text-align: center; background: #ffecd2; }
    .success { background: #a8e063 !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>🎙️ 録音くん</h1>
    
    <div class="input-group">
      <label>✨ グループを選択:</label>
      <select id="groupSelect">
        <option value="">-- グループを選択してください --</option>
        <option value="たぬきチーム">たぬきチーム</option>
        <option value="クールファイブ">クールファイブ</option>
      </select>
    </div>

    <div class="input-group">
      <label>✨ ニックネーム:</label>
      <input type="text" id="nicknameInput" placeholder="例: 山田太郎">
    </div>

    <div class="button-group">
      <button id="recordButton">🔴 録音開始</button>
      <button id="stopButton" disabled>⏹️ 停止</button>
    </div>
    <button id="saveButton" disabled>💾 ドライブに保存</button>
    <div id="status">マイクを許可して録音を開始してください</div>
  </div>

  <script>
    const recordButton = document.getElementById('recordButton');
    const stopButton = document.getElementById('stopButton');
    const saveButton = document.getElementById('saveButton');
    const statusDisplay = document.getElementById('status');
    const groupSelect = document.getElementById('groupSelect');
    const nicknameInput = document.getElementById('nicknameInput');
    
    let mediaRecorder;
    let audioChunks = [];
    let originalAudioBlob = null;
    let stream = null;

    recordButton.onclick = async () => {
      if (!groupSelect.value || !nicknameInput.value.trim()) return alert('グループ選択とニックネーム入力をしてください');
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        originalAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        statusDisplay.textContent = '✅ 録音完了。保存ボタンを押してください。';
        saveButton.disabled = false;
        audioChunks = [];
      };
      mediaRecorder.start();
      recordButton.disabled = true;
      stopButton.disabled = false;
      statusDisplay.textContent = '🎤 録音中...';
    };

    stopButton.onclick = () => {
      mediaRecorder.stop();
      stream.getTracks().forEach(t => t.stop());
      recordButton.disabled = false;
      stopButton.disabled = true;
    };

    saveButton.onclick = async () => {
      statusDisplay.textContent = '⏳ 送信中...';
      const mp3Blob = await encodeToMp3(originalAudioBlob);
      const reader = new FileReader();
      reader.readAsDataURL(mp3Blob);
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxSMniqNo-OIEPt7AqULUXHi1ZWPQW-G0iOv05e__9EVTc9HXn7lWAMu_dcCyquQ2rjNA/exec";
        
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `data=${encodeURIComponent(base64Data)}&filename=${groupSelect.value}_${nicknameInput.value}.mp3&mimetype=audio/mpeg`
        });
        statusDisplay.textContent = '🎉 保存完了！';
        statusDisplay.className = 'success';
      };
    };

    async function encodeToMp3(audioBlob) {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await audioBlob.arrayBuffer();
      const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
      const numChannels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
      const mp3Data = [];
      function floatTo16BitPCM(f) {
        const i = new Int16Array(f.length);
        for (let n = 0; n < f.length; n++) {
          const s = Math.max(-1, Math.min(1, f[n]));
          i[n] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return i;
      }
      const channelData = [audioBuffer.getChannelData(0), numChannels > 1 ? audioBuffer.getChannelData(1) : audioBuffer.getChannelData(0)];
      const sampleBlockSize = 1152;
      for (let i = 0; i < audioBuffer.length; i += sampleBlockSize) {
        const left = floatTo16BitPCM(channelData[0].subarray(i, i + sampleBlockSize));
        const right = floatTo16BitPCM(channelData[1].subarray(i, i + sampleBlockSize));
        const mp3buf = mp3encoder.encodeBuffer(left, right);
        if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
      }
      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
      return new Blob(mp3Data, { type: 'audio/mpeg' });
    }
  </script>
</body>
</html>
